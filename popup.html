<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 18px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #fafaf7;
      color: #222;
      text-align: center;
    }
    h1 {
      font-size: 17px;
      margin: 0 0 14px;
    }
    button {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      background: #3b6fd4;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #2f5cb5; }
    button:active { transform: scale(0.97); }
    p {
      font-size: 12px;
      color: #777;
      margin: 12px 0 0;
    }
  </style>
</head>
<body>
  <h1>📖 מצב קריאה נקי</h1>
  <button id="toggle">הפעל / כבה</button>
  <p>קיצור מקלדת: Alt+R</p>
  <script src="popup.js"></script>
</body>
</html>
